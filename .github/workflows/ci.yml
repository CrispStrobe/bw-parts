name: CI

# bw-parts had no CI at all. test/validate-parts.js was therefore run only
# when somebody remembered to, and on 2026-08-26 it failed FIVE ways on a
# clean checkout: three chips with a sidecar and no art, seven_seg_4 with a
# terminal off the canvas, and an untracked sidecar nobody could commit
# because it had no SVG. A validator that runs by hand is a validator that
# reports whatever the last person to type it saw.
on:
  push:
    branches: [main, master, 'align/**', 'fable/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every sidecar against its art
        run: npm test

      # Seating GATES now. It reported 73 errors on 2026-08-26 and 0 on
      # 2026-08-27: every one was a sidecar disagreeing with itself, a
      # footprint lead and a terminal for the same physical pin under two
      # names. Renaming to the engine's spelling closed all of them, and
      # npm test runs both checks, so this step exists only as its own
      # line in the log. Do not make it continue-on-error again.
