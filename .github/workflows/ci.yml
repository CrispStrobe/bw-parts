name: CI

# bw-parts had no CI at all. test/validate-parts.js was therefore run only
# when somebody remembered to, and on 2026-08-26 it failed FIVE ways on a
# clean checkout: three chips with a sidecar and no art, seven_seg_4 with a
# terminal off the canvas, and an untracked sidecar nobody could commit
# because it had no SVG. A validator that runs by hand is a validator that
# reports whatever the last person to type it saw.
on:
  push:
    branches: [main, master, 'align/**', 'fable/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every sidecar against its art
        run: npm test

      # Seating is NOT gating yet, and saying so is the point. On a clean
      # checkout verify-seating.js reports 73 errors — footprints whose lead
      # names do not match their own terminals (tmp36's footprint has a lead
      # "out" the part does not have, and 72 more). That is a real backlog,
      # not a flaky check, and hiding it behind a green build would be worse
      # than printing it every time. Gate it once the count reaches zero.
      - name: Seating report (not gating — 73 known errors)
        continue-on-error: true
        run: npm run test:seating
