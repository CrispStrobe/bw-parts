<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24" width="60" height="24">
  <!-- 10-Segment Bar Graph — bench-style -->
  <!-- Housing -->
  <rect x="2" y="2" width="56" height="16" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- 10 segments -->
  <rect x="5" y="4" width="4" height="12" rx="0.5" fill="#00ff00" opacity="0.9"/>
  <rect x="10.5" y="4" width="4" height="12" rx="0.5" fill="#00ff00" opacity="0.8"/>
  <rect x="16" y="4" width="4" height="12" rx="0.5" fill="#00ff00" opacity="0.7"/>
  <rect x="21.5" y="4" width="4" height="12" rx="0.5" fill="#88ff00" opacity="0.6"/>
  <rect x="27" y="4" width="4" height="12" rx="0.5" fill="#ccff00" opacity="0.5"/>
  <rect x="32.5" y="4" width="4" height="12" rx="0.5" fill="#ffcc00" opacity="0.4"/>
  <rect x="38" y="4" width="4" height="12" rx="0.5" fill="#ff8800" opacity="0.3"/>
  <rect x="43.5" y="4" width="4" height="12" rx="0.5" fill="#ff4400" opacity="0.25"/>
  <rect x="49" y="4" width="4" height="12" rx="0.5" fill="#ff0000" opacity="0.2"/>
  <rect x="54.5" y="4" width="3" height="12" rx="0.5" fill="#ff0000" opacity="0.15"/>
  <!-- Pins (bottom, 20 total simplified to edges) -->
  <line x1="10" y1="18" x2="10" y2="24" stroke="#aaa" stroke-width="0.8"/>
  <line x1="50" y1="18" x2="50" y2="24" stroke="#aaa" stroke-width="0.8"/>
</svg>
