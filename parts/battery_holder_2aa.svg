<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36" width="64" height="36">
  <!-- 2xAA Battery Holder — plastic holder with two cells, bench-style -->
  <!-- Holder body -->
  <rect x="2" y="4" width="60" height="24" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- Cell outlines -->
  <rect x="5" y="7" width="26" height="18" rx="2" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <rect x="33" y="7" width="26" height="18" rx="2" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <!-- Spring contacts -->
  <path d="M7 10 Q5 16 7 22" fill="none" stroke="#c0c0c0" stroke-width="1"/>
  <path d="M35 10 Q33 16 35 22" fill="none" stroke="#c0c0c0" stroke-width="1"/>
  <!-- Labels -->
  <text x="18" y="19" text-anchor="middle" font-family="monospace" font-size="5" fill="#555">1.5V</text>
  <text x="46" y="19" text-anchor="middle" font-family="monospace" font-size="5" fill="#555">1.5V</text>
  <!-- Wire leads -->
  <line x1="10" y1="28" x2="10" y2="36" stroke="#cc3030" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="28" x2="54" y2="36" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="10" cy="36" r="2" fill="#cc3030"/>
  <circle cx="54" cy="36" r="2" fill="#333"/>
  <text x="32" y="34" text-anchor="middle" font-family="monospace" font-size="4" fill="#666">3V</text>
</svg>
