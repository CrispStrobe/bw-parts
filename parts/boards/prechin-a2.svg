<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320">
  <!-- PRECHIN A2 Learning Board — stylized bench-style, own art -->

  <!-- PCB substrate -->
  <rect x="4" y="4" width="432" height="312" rx="4" fill="#1a6b2a" stroke="#0d4d15" stroke-width="1.5"/>
  <!-- PCB texture traces -->
  <line x1="120" y1="160" x2="200" y2="160" stroke="#1f7a30" stroke-width="0.5" opacity="0.4"/>
  <line x1="300" y1="100" x2="300" y2="200" stroke="#1f7a30" stroke-width="0.5" opacity="0.4"/>
  <line x1="60" y1="260" x2="180" y2="260" stroke="#1f7a30" stroke-width="0.5" opacity="0.4"/>

  <!-- Mounting holes -->
  <circle cx="14" cy="14" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="426" cy="14" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="14" cy="306" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="426" cy="306" r="4" fill="none" stroke="#888" stroke-width="0.8"/>

  <!-- Board title silk -->
  <text x="220" y="310" text-anchor="middle" font-family="monospace" font-size="8" fill="#c0d8c0" font-weight="bold">PRECHIN A2 LEARNING BOARD</text>

  <!-- ═══ DIP-40 MCU (STC89C52RC) — center ═══ -->
  <rect x="160" y="130" width="120" height="60" rx="2" fill="#252525" stroke="#111" stroke-width="1"/>
  <path d="M215 130 Q220 136 225 130" fill="#252525" stroke="#555" stroke-width="0.8"/>
  <circle cx="170" cy="140" r="2" fill="#666"/>
  <text x="220" y="156" text-anchor="middle" font-family="monospace" font-size="6" fill="#b0b0b0">STC89C52RC</text>
  <text x="220" y="165" text-anchor="middle" font-family="monospace" font-size="4" fill="#777">DIP-40</text>
  <!-- Left pins -->
  <g stroke="#aaa" stroke-width="1" stroke-linecap="round">
    <line x1="152" y1="134" x2="160" y2="134"/><line x1="152" y1="138" x2="160" y2="138"/>
    <line x1="152" y1="142" x2="160" y2="142"/><line x1="152" y1="146" x2="160" y2="146"/>
    <line x1="152" y1="150" x2="160" y2="150"/><line x1="152" y1="154" x2="160" y2="154"/>
    <line x1="152" y1="158" x2="160" y2="158"/><line x1="152" y1="162" x2="160" y2="162"/>
    <line x1="152" y1="166" x2="160" y2="166"/><line x1="152" y1="170" x2="160" y2="170"/>
    <line x1="152" y1="174" x2="160" y2="174"/><line x1="152" y1="178" x2="160" y2="178"/>
    <line x1="152" y1="182" x2="160" y2="182"/><line x1="152" y1="186" x2="160" y2="186"/>
  </g>
  <!-- Right pins -->
  <g stroke="#aaa" stroke-width="1" stroke-linecap="round">
    <line x1="280" y1="134" x2="288" y2="134"/><line x1="280" y1="138" x2="288" y2="138"/>
    <line x1="280" y1="142" x2="288" y2="142"/><line x1="280" y1="146" x2="288" y2="146"/>
    <line x1="280" y1="150" x2="288" y2="150"/><line x1="280" y1="154" x2="288" y2="154"/>
    <line x1="280" y1="158" x2="288" y2="158"/><line x1="280" y1="162" x2="288" y2="162"/>
    <line x1="280" y1="166" x2="288" y2="166"/><line x1="280" y1="170" x2="288" y2="170"/>
    <line x1="280" y1="174" x2="288" y2="174"/><line x1="280" y1="178" x2="288" y2="178"/>
    <line x1="280" y1="182" x2="288" y2="182"/><line x1="280" y1="186" x2="288" y2="186"/>
  </g>

  <!-- Crystal -->
  <rect x="130" y="148" width="14" height="8" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
  <text x="137" y="154" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#555">11.05</text>

  <!-- ═══ 8x8 LED MATRIX (upper left) ═══ -->
  <g id="MATRIX">
    <rect x="20" y="20" width="90" height="90" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <!-- 8x8 dot grid -->
    <g fill="#330000">
      <!-- Row 0 -->
      <circle cx="30" cy="30" r="3"/><circle cx="41" cy="30" r="3"/><circle cx="52" cy="30" r="3"/><circle cx="63" cy="30" r="3"/>
      <circle cx="74" cy="30" r="3"/><circle cx="85" cy="30" r="3"/><circle cx="96" cy="30" r="3"/><circle cx="107" cy="30" r="3"/>
      <!-- Row 1 -->
      <circle cx="30" cy="41" r="3"/><circle cx="41" cy="41" r="3"/><circle cx="52" cy="41" r="3"/><circle cx="63" cy="41" r="3"/>
      <circle cx="74" cy="41" r="3"/><circle cx="85" cy="41" r="3"/><circle cx="96" cy="41" r="3"/><circle cx="107" cy="41" r="3"/>
      <!-- Row 2 -->
      <circle cx="30" cy="52" r="3"/><circle cx="41" cy="52" r="3"/><circle cx="52" cy="52" r="3"/><circle cx="63" cy="52" r="3"/>
      <circle cx="74" cy="52" r="3"/><circle cx="85" cy="52" r="3"/><circle cx="96" cy="52" r="3"/><circle cx="107" cy="52" r="3"/>
      <!-- Row 3 -->
      <circle cx="30" cy="63" r="3"/><circle cx="41" cy="63" r="3"/><circle cx="52" cy="63" r="3"/><circle cx="63" cy="63" r="3"/>
      <circle cx="74" cy="63" r="3"/><circle cx="85" cy="63" r="3"/><circle cx="96" cy="63" r="3"/><circle cx="107" cy="63" r="3"/>
      <!-- Row 4 -->
      <circle cx="30" cy="74" r="3"/><circle cx="41" cy="74" r="3"/><circle cx="52" cy="74" r="3"/><circle cx="63" cy="74" r="3"/>
      <circle cx="74" cy="74" r="3"/><circle cx="85" cy="74" r="3"/><circle cx="96" cy="74" r="3"/><circle cx="107" cy="74" r="3"/>
      <!-- Row 5 -->
      <circle cx="30" cy="85" r="3"/><circle cx="41" cy="85" r="3"/><circle cx="52" cy="85" r="3"/><circle cx="63" cy="85" r="3"/>
      <circle cx="74" cy="85" r="3"/><circle cx="85" cy="85" r="3"/><circle cx="96" cy="85" r="3"/><circle cx="107" cy="85" r="3"/>
      <!-- Row 6 -->
      <circle cx="30" cy="96" r="3"/><circle cx="41" cy="96" r="3"/><circle cx="52" cy="96" r="3"/><circle cx="63" cy="96" r="3"/>
      <circle cx="74" cy="96" r="3"/><circle cx="85" cy="96" r="3"/><circle cx="96" cy="96" r="3"/><circle cx="107" cy="96" r="3"/>
      <!-- Row 7 -->
      <circle cx="30" cy="107" r="3"/><circle cx="41" cy="107" r="3"/><circle cx="52" cy="107" r="3"/><circle cx="63" cy="107" r="3"/>
      <circle cx="74" cy="107" r="3"/><circle cx="85" cy="107" r="3"/><circle cx="96" cy="107" r="3"/><circle cx="107" cy="107" r="3"/>
    </g>
  </g>
  <text x="65" y="118" text-anchor="middle" font-family="monospace" font-size="4" fill="#8fbc8f">8x8 MATRIX</text>

  <!-- 2x 74HC595 for matrix -->
  <rect x="20" y="122" width="40" height="14" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="40" y="131" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">74HC595</text>
  <rect x="64" y="122" width="40" height="14" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="84" y="131" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">74HC595</text>

  <!-- ═══ 4x4 KEYPAD (upper right) ═══ -->
  <g id="KEYPAD">
    <rect x="320" y="20" width="100" height="100" rx="2" fill="#e8e0d0" stroke="#bbb" stroke-width="0.8"/>
    <!-- 4x4 button grid -->
    <g fill="#ddd" stroke="#aaa" stroke-width="0.5">
      <!-- Row 0 -->
      <rect x="328" y="28" width="18" height="18" rx="2"/><rect x="350" y="28" width="18" height="18" rx="2"/>
      <rect x="372" y="28" width="18" height="18" rx="2"/><rect x="394" y="28" width="18" height="18" rx="2"/>
      <!-- Row 1 -->
      <rect x="328" y="50" width="18" height="18" rx="2"/><rect x="350" y="50" width="18" height="18" rx="2"/>
      <rect x="372" y="50" width="18" height="18" rx="2"/><rect x="394" y="50" width="18" height="18" rx="2"/>
      <!-- Row 2 -->
      <rect x="328" y="72" width="18" height="18" rx="2"/><rect x="350" y="72" width="18" height="18" rx="2"/>
      <rect x="372" y="72" width="18" height="18" rx="2"/><rect x="394" y="72" width="18" height="18" rx="2"/>
      <!-- Row 3 -->
      <rect x="328" y="94" width="18" height="18" rx="2"/><rect x="350" y="94" width="18" height="18" rx="2"/>
      <rect x="372" y="94" width="18" height="18" rx="2"/><rect x="394" y="94" width="18" height="18" rx="2"/>
    </g>
    <!-- Key labels -->
    <g fill="#555" font-family="monospace" font-size="6" text-anchor="middle">
      <text x="337" y="41">1</text><text x="359" y="41">2</text><text x="381" y="41">3</text><text x="403" y="41">A</text>
      <text x="337" y="63">4</text><text x="359" y="63">5</text><text x="381" y="63">6</text><text x="403" y="63">B</text>
      <text x="337" y="85">7</text><text x="359" y="85">8</text><text x="381" y="85">9</text><text x="403" y="85">C</text>
      <text x="337" y="107">*</text><text x="359" y="107">0</text><text x="381" y="107">#</text><text x="403" y="107">D</text>
    </g>
  </g>
  <text x="370" y="128" text-anchor="middle" font-family="monospace" font-size="4" fill="#8fbc8f">4x4 KEYPAD</text>

  <!-- 74C922 encoder -->
  <rect x="320" y="132" width="50" height="14" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="345" y="141" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">74C922</text>

  <!-- ═══ LED ROW (8 LEDs, middle-right area) ═══ -->
  <g id="led-row">
    <circle id="L1" cx="310" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="310" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L2" cx="326" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="326" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L3" cx="342" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="342" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L4" cx="358" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="358" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L5" cx="374" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="374" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L6" cx="390" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="390" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L7" cx="406" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="406" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
    <circle id="L8" cx="422" cy="170" r="5" fill="#330000" stroke="#555" stroke-width="0.4"/>
    <circle cx="422" cy="170" r="2.8" fill="#660000" opacity="0.6"/>
  </g>
  <text x="366" y="182" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">LED 1-8</text>

  <!-- ═══ 7-SEG PAIR (two digits, below keypad) ═══ -->
  <g id="SEG-PAIR">
    <rect x="330" y="186" width="50" height="28" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <!-- Digit outlines -->
    <g fill="none" stroke="#330000" stroke-width="0.8">
      <rect x="336" y="190" width="16" height="20" rx="1"/>
      <rect x="358" y="190" width="16" height="20" rx="1"/>
    </g>
    <!-- Dim segments -->
    <g fill="#330000" opacity="0.5">
      <!-- Digit 1 -->
      <rect x="340" y="192" width="8" height="1.5" rx="0.5"/>
      <rect x="340" y="199" width="8" height="1.5" rx="0.5"/>
      <rect x="340" y="206" width="8" height="1.5" rx="0.5"/>
      <rect x="338" y="193.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="348.5" y="193.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="338" y="200.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="348.5" y="200.5" width="1.5" height="5.5" rx="0.5"/>
      <!-- Digit 2 -->
      <rect x="362" y="192" width="8" height="1.5" rx="0.5"/>
      <rect x="362" y="199" width="8" height="1.5" rx="0.5"/>
      <rect x="362" y="206" width="8" height="1.5" rx="0.5"/>
      <rect x="360" y="193.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="370.5" y="193.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="360" y="200.5" width="1.5" height="5.5" rx="0.5"/>
      <rect x="370.5" y="200.5" width="1.5" height="5.5" rx="0.5"/>
    </g>
  </g>
  <text x="355" y="222" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">7-SEG</text>

  <!-- ═══ DS1302 RTC spot (lower left area) ═══ -->
  <g id="DS1302">
    <rect x="20" y="200" width="44" height="20" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="42" y="212" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaa">DS1302</text>
    <!-- Crystal -->
    <rect x="22" y="222" width="10" height="5" rx="1.5" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>
    <!-- Battery holder -->
    <circle cx="52" cy="230" r="8" fill="none" stroke="#888" stroke-width="0.5"/>
    <text x="52" y="232" text-anchor="middle" font-family="monospace" font-size="3" fill="#666">BAT</text>
  </g>
  <text x="42" y="246" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">RTC</text>

  <!-- ═══ DS18B20 temperature sensor spot ═══ -->
  <g id="DS18B20">
    <path d="M86 206 Q96 202 106 206 L106 218 Q96 222 86 218 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <text x="96" y="214" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#aaa">DS18B20</text>
  </g>
  <text x="96" y="230" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">TEMP</text>

  <!-- ═══ AT24C02 EEPROM ═══ -->
  <rect x="120" y="204" width="34" height="14" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="137" y="213" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">AT24C02</text>
  <text x="137" y="224" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">EEPROM</text>

  <!-- ═══ LCD1602 connector (16-pin header) ═══ -->
  <g id="LCD-HDR">
    <rect x="20" y="148" width="100" height="12" rx="1" fill="#444" stroke="#333" stroke-width="0.6"/>
    <g fill="#c0c0c0">
      <circle cx="26" cy="154" r="1.5"/><circle cx="32" cy="154" r="1.5"/>
      <circle cx="38" cy="154" r="1.5"/><circle cx="44" cy="154" r="1.5"/>
      <circle cx="50" cy="154" r="1.5"/><circle cx="56" cy="154" r="1.5"/>
      <circle cx="62" cy="154" r="1.5"/><circle cx="68" cy="154" r="1.5"/>
      <circle cx="74" cy="154" r="1.5"/><circle cx="80" cy="154" r="1.5"/>
      <circle cx="86" cy="154" r="1.5"/><circle cx="92" cy="154" r="1.5"/>
      <circle cx="98" cy="154" r="1.5"/><circle cx="104" cy="154" r="1.5"/>
      <circle cx="110" cy="154" r="1.5"/><circle cx="116" cy="154" r="1.5"/>
    </g>
  </g>
  <text x="70" y="146" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">LCD1602</text>

  <!-- ═══ IR Receiver ═══ -->
  <g id="IR">
    <path d="M180 206 Q190 200 200 206 L200 220 L180 220 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <!-- IR dome -->
    <circle cx="190" cy="210" r="4" fill="#222" stroke="#444" stroke-width="0.3"/>
  </g>
  <text x="190" y="230" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">IR</text>

  <!-- ═══ Buzzer ═══ -->
  <g id="BZ">
    <circle cx="230" cy="212" r="12" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <circle cx="230" cy="212" r="8" fill="#222" stroke="#333" stroke-width="0.4"/>
    <circle cx="230" cy="212" r="2.5" fill="#333"/>
    <text x="230" y="202" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">+</text>
  </g>
  <text x="230" y="230" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">BUZZER</text>

  <!-- ═══ Pull-up resistors ═══ -->
  <rect x="168" y="200" width="4" height="10" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="174" y="200" width="4" height="10" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <text x="173" y="218" text-anchor="middle" font-family="monospace" font-size="2" fill="#8fbc8f">4K7</text>

  <!-- ═══ Headers (right edge, expansion) ═══ -->
  <g id="HDR-P0">
    <rect x="420" y="200" width="10" height="70" rx="1" fill="#444" stroke="#333" stroke-width="0.5"/>
    <g fill="#c0c0c0">
      <circle cx="425" cy="208" r="1.5"/><circle cx="425" cy="216" r="1.5"/>
      <circle cx="425" cy="224" r="1.5"/><circle cx="425" cy="232" r="1.5"/>
      <circle cx="425" cy="240" r="1.5"/><circle cx="425" cy="248" r="1.5"/>
      <circle cx="425" cy="256" r="1.5"/><circle cx="425" cy="264" r="1.5"/>
    </g>
    <text x="425" y="278" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">P0</text>
  </g>

  <g id="HDR-P2">
    <rect x="400" y="200" width="10" height="70" rx="1" fill="#444" stroke="#333" stroke-width="0.5"/>
    <g fill="#c0c0c0">
      <circle cx="405" cy="208" r="1.5"/><circle cx="405" cy="216" r="1.5"/>
      <circle cx="405" cy="224" r="1.5"/><circle cx="405" cy="232" r="1.5"/>
      <circle cx="405" cy="240" r="1.5"/><circle cx="405" cy="248" r="1.5"/>
      <circle cx="405" cy="256" r="1.5"/><circle cx="405" cy="264" r="1.5"/>
    </g>
    <text x="405" y="278" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">P2</text>
  </g>

  <!-- ═══ Reset button ═══ -->
  <rect x="290" y="148" width="14" height="10" rx="2" fill="#cc3333" stroke="#992222" stroke-width="0.5"/>
  <text x="297" y="164" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">RST</text>

  <!-- ═══ Power LED ═══ -->
  <circle cx="310" cy="153" r="3" fill="#003300" stroke="#555" stroke-width="0.3"/>
  <text x="310" y="164" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">PWR</text>

  <!-- ═══ ISP header ═══ -->
  <rect x="290" y="200" width="20" height="14" rx="1" fill="#444" stroke="#333" stroke-width="0.6"/>
  <circle cx="296" cy="205" r="1.5" fill="#c0c0c0"/>
  <circle cx="304" cy="205" r="1.5" fill="#c0c0c0"/>
  <circle cx="296" cy="211" r="1.5" fill="#c0c0c0"/>
  <circle cx="304" cy="211" r="1.5" fill="#c0c0c0"/>
  <text x="300" y="220" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">ISP</text>

  <!-- ═══ Power connector ═══ -->
  <rect x="20" y="260" width="30" height="16" rx="2" fill="#333" stroke="#222" stroke-width="0.6"/>
  <circle cx="35" cy="268" r="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="35" y="284" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">DC IN</text>

  <!-- ═══ Decoupling caps ═══ -->
  <rect x="140" y="140" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="294" y="140" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="258" y="204" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>

  <!-- ═══ Voltage regulator ═══ -->
  <rect x="60" y="262" width="16" height="10" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="68" y="269" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">7805</text>
</svg>
