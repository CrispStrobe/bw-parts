<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <!-- YL-39 Minimum System Board — stylized bench-style, own art -->

  <!-- PCB substrate -->
  <rect x="4" y="4" width="312" height="232" rx="4" fill="#1a6b2a" stroke="#0d4d15" stroke-width="1.5"/>
  <!-- PCB texture traces (decorative) -->
  <line x1="20" y1="120" x2="80" y2="120" stroke="#1f7a30" stroke-width="0.5" opacity="0.5"/>
  <line x1="240" y1="80" x2="300" y2="80" stroke="#1f7a30" stroke-width="0.5" opacity="0.5"/>
  <line x1="160" y1="200" x2="160" y2="230" stroke="#1f7a30" stroke-width="0.5" opacity="0.5"/>

  <!-- Mounting holes -->
  <circle cx="14" cy="14" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="306" cy="14" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="14" cy="226" r="4" fill="none" stroke="#888" stroke-width="0.8"/>
  <circle cx="306" cy="226" r="4" fill="none" stroke="#888" stroke-width="0.8"/>

  <!-- Board title silk -->
  <text x="160" y="230" text-anchor="middle" font-family="monospace" font-size="7" fill="#c0d8c0" font-weight="bold">YL-39 MINIMUM SYSTEM</text>

  <!-- ═══ DIP-40 MCU (STC89C52RC) — center ═══ -->
  <rect x="100" y="80" width="120" height="60" rx="2" fill="#252525" stroke="#111" stroke-width="1"/>
  <path d="M155 80 Q160 86 165 80" fill="#252525" stroke="#555" stroke-width="0.8"/>
  <circle cx="110" cy="90" r="2" fill="#666"/>
  <text x="160" y="106" text-anchor="middle" font-family="monospace" font-size="6" fill="#b0b0b0">STC89C52RC</text>
  <text x="160" y="115" text-anchor="middle" font-family="monospace" font-size="4" fill="#777">DIP-40</text>
  <!-- Left pins (20) -->
  <g stroke="#aaa" stroke-width="1" stroke-linecap="round">
    <line x1="92" y1="84" x2="100" y2="84"/><line x1="92" y1="88" x2="100" y2="88"/>
    <line x1="92" y1="92" x2="100" y2="92"/><line x1="92" y1="96" x2="100" y2="96"/>
    <line x1="92" y1="100" x2="100" y2="100"/><line x1="92" y1="104" x2="100" y2="104"/>
    <line x1="92" y1="108" x2="100" y2="108"/><line x1="92" y1="112" x2="100" y2="112"/>
    <line x1="92" y1="116" x2="100" y2="116"/><line x1="92" y1="120" x2="100" y2="120"/>
    <line x1="92" y1="124" x2="100" y2="124"/><line x1="92" y1="128" x2="100" y2="128"/>
    <line x1="92" y1="132" x2="100" y2="132"/><line x1="92" y1="136" x2="100" y2="136"/>
  </g>
  <!-- Right pins -->
  <g stroke="#aaa" stroke-width="1" stroke-linecap="round">
    <line x1="220" y1="84" x2="228" y2="84"/><line x1="220" y1="88" x2="228" y2="88"/>
    <line x1="220" y1="92" x2="228" y2="92"/><line x1="220" y1="96" x2="228" y2="96"/>
    <line x1="220" y1="100" x2="228" y2="100"/><line x1="220" y1="104" x2="228" y2="104"/>
    <line x1="220" y1="108" x2="228" y2="108"/><line x1="220" y1="112" x2="228" y2="112"/>
    <line x1="220" y1="116" x2="228" y2="116"/><line x1="220" y1="120" x2="228" y2="120"/>
    <line x1="220" y1="124" x2="228" y2="124"/><line x1="220" y1="128" x2="228" y2="128"/>
    <line x1="220" y1="132" x2="228" y2="132"/><line x1="220" y1="136" x2="228" y2="136"/>
  </g>

  <!-- ═══ Crystal oscillator (11.0592 MHz) ═══ -->
  <rect x="68" y="94" width="14" height="8" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
  <text x="75" y="100" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#555">11.05</text>

  <!-- ═══ 74HC595 shift register ═══ -->
  <rect x="240" y="86" width="50" height="20" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="265" y="98" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaa">74HC595</text>

  <!-- ═══ D1-D8 LED row (top, across board) ═══ -->
  <g id="led-row">
    <!-- LED housings -->
    <circle id="D1" cx="52" cy="28" r="6" fill="#330000" stroke="#555" stroke-width="0.5"/>
    <circle cx="52" cy="28" r="3.5" fill="#660000" opacity="0.6"/>
    <circle id="D2" cx="80" cy="28" r="6" fill="#330000" stroke="#555" stroke-width="0.5"/>
    <circle cx="80" cy="28" r="3.5" fill="#660000" opacity="0.6"/>
    <circle id="D3" cx="108" cy="28" r="6" fill="#330000" stroke="#555" stroke-width="0.5"/>
    <circle cx="108" cy="28" r="3.5" fill="#660000" opacity="0.6"/>
    <circle id="D4" cx="136" cy="28" r="6" fill="#330000" stroke="#555" stroke-width="0.5"/>
    <circle cx="136" cy="28" r="3.5" fill="#660000" opacity="0.6"/>
    <circle id="D5" cx="164" cy="28" r="6" fill="#003300" stroke="#555" stroke-width="0.5"/>
    <circle cx="164" cy="28" r="3.5" fill="#006600" opacity="0.6"/>
    <circle id="D6" cx="192" cy="28" r="6" fill="#003300" stroke="#555" stroke-width="0.5"/>
    <circle cx="192" cy="28" r="3.5" fill="#006600" opacity="0.6"/>
    <circle id="D7" cx="220" cy="28" r="6" fill="#003300" stroke="#555" stroke-width="0.5"/>
    <circle cx="220" cy="28" r="3.5" fill="#006600" opacity="0.6"/>
    <circle id="D8" cx="248" cy="28" r="6" fill="#003300" stroke="#555" stroke-width="0.5"/>
    <circle cx="248" cy="28" r="3.5" fill="#006600" opacity="0.6"/>
  </g>
  <!-- LED labels silk -->
  <text x="52" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D1</text>
  <text x="80" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D2</text>
  <text x="108" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D3</text>
  <text x="136" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D4</text>
  <text x="164" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D5</text>
  <text x="192" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D6</text>
  <text x="220" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D7</text>
  <text x="248" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">D8</text>

  <!-- ═══ SEG — 4-digit 7-segment display (right side) ═══ -->
  <g id="SEG">
    <rect x="240" y="46" width="66" height="30" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
    <!-- Digit outlines (4 digits) -->
    <g fill="none" stroke="#330000" stroke-width="0.8">
      <rect x="244" y="50" width="12" height="22" rx="1"/>
      <rect x="258" y="50" width="12" height="22" rx="1"/>
      <rect x="272" y="50" width="12" height="22" rx="1"/>
      <rect x="286" y="50" width="12" height="22" rx="1"/>
    </g>
    <!-- Segment shapes (dim, showing 8.8.8.8) -->
    <g fill="#330000" opacity="0.5">
      <!-- Digit 1 segments -->
      <rect x="247" y="52" width="6" height="1.5" rx="0.5"/>
      <rect x="247" y="58" width="6" height="1.5" rx="0.5"/>
      <rect x="247" y="64" width="6" height="1.5" rx="0.5"/>
      <rect x="245" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="253.5" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="245" y="59.5" width="1.5" height="5" rx="0.5"/>
      <rect x="253.5" y="59.5" width="1.5" height="5" rx="0.5"/>
      <!-- Digit 2 segments -->
      <rect x="261" y="52" width="6" height="1.5" rx="0.5"/>
      <rect x="261" y="58" width="6" height="1.5" rx="0.5"/>
      <rect x="261" y="64" width="6" height="1.5" rx="0.5"/>
      <rect x="259" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="267.5" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="259" y="59.5" width="1.5" height="5" rx="0.5"/>
      <rect x="267.5" y="59.5" width="1.5" height="5" rx="0.5"/>
      <!-- Digit 3 segments -->
      <rect x="275" y="52" width="6" height="1.5" rx="0.5"/>
      <rect x="275" y="58" width="6" height="1.5" rx="0.5"/>
      <rect x="275" y="64" width="6" height="1.5" rx="0.5"/>
      <rect x="273" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="281.5" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="273" y="59.5" width="1.5" height="5" rx="0.5"/>
      <rect x="281.5" y="59.5" width="1.5" height="5" rx="0.5"/>
      <!-- Digit 4 segments -->
      <rect x="289" y="52" width="6" height="1.5" rx="0.5"/>
      <rect x="289" y="58" width="6" height="1.5" rx="0.5"/>
      <rect x="289" y="64" width="6" height="1.5" rx="0.5"/>
      <rect x="287" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="295.5" y="53" width="1.5" height="5" rx="0.5"/>
      <rect x="287" y="59.5" width="1.5" height="5" rx="0.5"/>
      <rect x="295.5" y="59.5" width="1.5" height="5" rx="0.5"/>
    </g>
  </g>
  <text x="273" y="82" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">7-SEG</text>

  <!-- ═══ BZ — Buzzer (lower left) ═══ -->
  <g id="BZ">
    <circle cx="40" cy="170" r="14" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
    <circle cx="40" cy="170" r="10" fill="#222" stroke="#333" stroke-width="0.5"/>
    <circle cx="40" cy="170" r="3" fill="#333"/>
    <!-- + mark -->
    <text x="40" y="158" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">+</text>
  </g>
  <text x="40" y="190" text-anchor="middle" font-family="monospace" font-size="4" fill="#8fbc8f">BUZZER</text>

  <!-- ═══ POT — Potentiometer (lower right) ═══ -->
  <g id="POT">
    <circle cx="280" cy="170" r="14" fill="#4682b4" stroke="#36648b" stroke-width="1"/>
    <circle cx="280" cy="170" r="9" fill="#5a9cc8" stroke="#4682b4" stroke-width="0.5"/>
    <!-- Wiper slot -->
    <line x1="280" y1="160" x2="280" y2="168" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arrow indicating rotation -->
    <path d="M272 160 Q280 155 288 160" fill="none" stroke="#8fbc8f" stroke-width="0.5"/>
  </g>
  <text x="280" y="190" text-anchor="middle" font-family="monospace" font-size="4" fill="#8fbc8f">POT</text>

  <!-- ═══ 4 Buttons (bottom center row) ═══ -->
  <g id="buttons">
    <rect x="104" y="158" width="16" height="12" rx="2" fill="#444" stroke="#333" stroke-width="0.6"/>
    <rect x="107" y="161" width="10" height="6" rx="1" fill="#666" stroke="#555" stroke-width="0.3"/>
    <text x="112" y="176" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">S1</text>

    <rect x="128" y="158" width="16" height="12" rx="2" fill="#444" stroke="#333" stroke-width="0.6"/>
    <rect x="131" y="161" width="10" height="6" rx="1" fill="#666" stroke="#555" stroke-width="0.3"/>
    <text x="136" y="176" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">S2</text>

    <rect x="152" y="158" width="16" height="12" rx="2" fill="#444" stroke="#333" stroke-width="0.6"/>
    <rect x="155" y="161" width="10" height="6" rx="1" fill="#666" stroke="#555" stroke-width="0.3"/>
    <text x="160" y="176" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">S3</text>

    <rect x="176" y="158" width="16" height="12" rx="2" fill="#444" stroke="#333" stroke-width="0.6"/>
    <rect x="179" y="161" width="10" height="6" rx="1" fill="#666" stroke="#555" stroke-width="0.3"/>
    <text x="184" y="176" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">S4</text>
  </g>

  <!-- ═══ Reset button (red) ═══ -->
  <rect x="48" y="100" width="12" height="8" rx="2" fill="#cc3333" stroke="#992222" stroke-width="0.5"/>
  <text x="54" y="114" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">RST</text>

  <!-- ═══ Power LED ═══ -->
  <circle cx="28" cy="56" r="3" fill="#003300" stroke="#555" stroke-width="0.3"/>
  <text x="28" y="64" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">PWR</text>

  <!-- ═══ Power header (2-pin) ═══ -->
  <rect x="10" y="196" width="24" height="10" rx="1" fill="#444" stroke="#333" stroke-width="0.6"/>
  <circle cx="18" cy="201" r="2" fill="#c0c0c0"/>
  <circle cx="28" cy="201" r="2" fill="#c0c0c0"/>
  <text x="22" y="214" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">VCC GND</text>

  <!-- ═══ ISP header (6-pin, 2x3) ═══ -->
  <rect x="240" y="120" width="20" height="14" rx="1" fill="#444" stroke="#333" stroke-width="0.6"/>
  <circle cx="246" cy="125" r="1.5" fill="#c0c0c0"/>
  <circle cx="254" cy="125" r="1.5" fill="#c0c0c0"/>
  <circle cx="246" cy="131" r="1.5" fill="#c0c0c0"/>
  <circle cx="254" cy="131" r="1.5" fill="#c0c0c0"/>
  <text x="250" y="140" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8fbc8f">ISP</text>

  <!-- ═══ Decoupling caps ═══ -->
  <rect x="78" y="80" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="232" y="104" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>

  <!-- ═══ Resistor network (SIP) for LEDs ═══ -->
  <rect x="48" y="46" width="204" height="6" rx="1" fill="#333" stroke="#222" stroke-width="0.5"/>
  <text x="150" y="50" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">1K x 8</text>
</svg>
