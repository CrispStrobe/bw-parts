<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <!-- DHT11 Temp & Humidity Sensor — blue module, bench-style -->
  <!-- Body -->
  <rect x="3" y="2" width="30" height="32" rx="2" fill="#3388cc" stroke="#2266aa" stroke-width="0.8"/>
  <!-- Ventilation slots -->
  <g stroke="#2a70a8" stroke-width="0.8">
    <line x1="8" y1="8" x2="28" y2="8"/>
    <line x1="8" y1="12" x2="28" y2="12"/>
    <line x1="8" y1="16" x2="28" y2="16"/>
    <line x1="8" y1="20" x2="28" y2="20"/>
  </g>
  <!-- Label -->
  <text x="18" y="30" text-anchor="middle" font-family="monospace" font-size="4" fill="#c0d8f0">DHT11</text>
  <!-- 3 pins (4th is NC) -->
  <line x1="10" y1="34" x2="10" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="34" x2="18" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="34" x2="26" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="18" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="26" cy="44" r="1.5" fill="#c0c0c0"/>
</svg>
