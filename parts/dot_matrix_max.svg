<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 44" width="56" height="44">
  <!-- LED Matrix MAX7219 — module with driver IC, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="52" height="34" rx="2" fill="#cc0000" stroke="#aa0000" stroke-width="0.8"/>
  <!-- 8x8 LED matrix module on PCB -->
  <rect x="6" y="4" width="28" height="28" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- LED dots -->
  <g fill="#ff2020" opacity="0.3">
    <circle cx="10" cy="8" r="1.2"/><circle cx="14" cy="8" r="1.2"/><circle cx="18" cy="8" r="1.2"/><circle cx="22" cy="8" r="1.2"/><circle cx="26" cy="8" r="1.2"/><circle cx="30" cy="8" r="1.2"/>
    <circle cx="10" cy="12" r="1.2"/><circle cx="14" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="22" cy="12" r="1.2"/><circle cx="26" cy="12" r="1.2"/><circle cx="30" cy="12" r="1.2"/>
    <circle cx="10" cy="16" r="1.2"/><circle cx="14" cy="16" r="1.2"/><circle cx="18" cy="16" r="1.2"/><circle cx="22" cy="16" r="1.2"/><circle cx="26" cy="16" r="1.2"/><circle cx="30" cy="16" r="1.2"/>
    <circle cx="10" cy="20" r="1.2"/><circle cx="14" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><circle cx="22" cy="20" r="1.2"/><circle cx="26" cy="20" r="1.2"/><circle cx="30" cy="20" r="1.2"/>
    <circle cx="10" cy="24" r="1.2"/><circle cx="14" cy="24" r="1.2"/><circle cx="18" cy="24" r="1.2"/><circle cx="22" cy="24" r="1.2"/><circle cx="26" cy="24" r="1.2"/><circle cx="30" cy="24" r="1.2"/>
    <circle cx="10" cy="28" r="1.2"/><circle cx="14" cy="28" r="1.2"/><circle cx="18" cy="28" r="1.2"/><circle cx="22" cy="28" r="1.2"/><circle cx="26" cy="28" r="1.2"/><circle cx="30" cy="28" r="1.2"/>
  </g>
  <!-- MAX7219 IC -->
  <rect x="38" y="8" width="12" height="20" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="44" y="20" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">7219</text>
  <!-- 5-pin header -->
  <line x1="10" y1="36" x2="10" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="18" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="36" x2="26" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="36" x2="34" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="36" x2="42" y2="44" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="18" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="26" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="34" cy="44" r="1.5" fill="#c0c0c0"/>
  <circle cx="42" cy="44" r="1.5" fill="#c0c0c0"/>
</svg>
