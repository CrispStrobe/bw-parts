<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- NOR gate — bench-style DIP-like package -->
  <rect x="8" y="6" width="32" height="36" rx="3" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- OR shape + bubble -->
  <path d="M16 16 Q20 16 24 16 Q32 16 34 24 Q32 32 24 32 Q20 32 16 32 Q20 24 16 16 Z" fill="none" stroke="#b0b0b0" stroke-width="1.2"/>
  <circle cx="36.5" cy="24" r="2" fill="none" stroke="#b0b0b0" stroke-width="1.2"/>
  <circle cx="13" cy="11" r="1.5" fill="#b0b0b0"/>
  <text x="24" y="26" text-anchor="middle" font-family="monospace" font-size="5" fill="#c0c0c0">NOR</text>
  <!-- Input pins -->
  <line x1="0" y1="16" x2="8" y2="16" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="32" x2="8" y2="32" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <!-- Output pin -->
  <line x1="40" y1="24" x2="48" y2="24" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="0" cy="16" r="2" fill="#c0c0c0"/>
  <circle cx="0" cy="32" r="2" fill="#c0c0c0"/>
  <circle cx="48" cy="24" r="2" fill="#c0c0c0"/>
</svg>
