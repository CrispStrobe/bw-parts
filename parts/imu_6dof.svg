<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" width="48" height="36">
  <!-- IMU 6-DOF (MPU-6050) — breakout board, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="44" height="32" rx="2" fill="#6600aa" stroke="#4400880" stroke-width="0.8"/>
  <!-- IC chip -->
  <rect x="14" y="8" width="14" height="14" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="21" y="16" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">MPU</text>
  <text x="21" y="20" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">6050</text>
  <!-- Axis labels -->
  <text x="38" y="12" text-anchor="middle" font-family="monospace" font-size="4" fill="#ff6666">X</text>
  <text x="38" y="20" text-anchor="middle" font-family="monospace" font-size="4" fill="#66ff66">Y</text>
  <text x="38" y="28" text-anchor="middle" font-family="monospace" font-size="4" fill="#6666ff">Z</text>
  <!-- Pin header (8 pins left side) -->
  <line x1="6" y1="8" x2="0" y2="8" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="14" x2="0" y2="14" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="20" x2="0" y2="20" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="26" x2="0" y2="26" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="0" y2="32" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="8" r="1.5" fill="#c0c0c0"/>
  <circle cx="0" cy="14" r="1.5" fill="#c0c0c0"/>
  <circle cx="0" cy="20" r="1.5" fill="#c0c0c0"/>
  <circle cx="0" cy="26" r="1.5" fill="#c0c0c0"/>
  <circle cx="0" cy="32" r="1.5" fill="#c0c0c0"/>
</svg>
