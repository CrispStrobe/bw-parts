<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 48" width="90" height="48">
  <!-- L293D H-Bridge Motor Driver — 16-pin DIP package, bench-style -->
  <!-- Package body -->
  <rect x="10" y="2" width="70" height="44" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Notch -->
  <path d="M42 2 Q45 6 48 2" fill="#303030" stroke="#555" stroke-width="0.8"/>
  <!-- Pin 1 dot -->
  <circle cx="16" cy="8" r="1.5" fill="#b0b0b0"/>
  <!-- IC label -->
  <text x="45" y="22" text-anchor="middle" font-family="monospace" font-size="6" fill="#c0c0c0">L293D</text>
  <text x="45" y="30" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">H-BRIDGE</text>

  <!-- Left pins (1-8, top to bottom) -->
  <line x1="0" y1="6" x2="10" y2="6" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="6" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="11" x2="10" y2="11" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="11" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="16" x2="10" y2="16" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="16" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="21" x2="10" y2="21" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="21" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="26" x2="10" y2="26" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="26" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="31" x2="10" y2="31" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="31" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="36" x2="10" y2="36" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="36" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="41" x2="10" y2="41" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="41" r="1.5" fill="#c0c0c0"/>

  <!-- Right pins (16-9, top to bottom) -->
  <line x1="80" y1="6" x2="90" y2="6" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="6" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="11" x2="90" y2="11" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="11" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="16" x2="90" y2="16" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="16" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="21" x2="90" y2="21" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="21" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="26" x2="90" y2="26" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="26" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="31" x2="90" y2="31" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="31" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="36" x2="90" y2="36" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="36" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="41" x2="90" y2="41" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="41" r="1.5" fill="#c0c0c0"/>
</svg>
