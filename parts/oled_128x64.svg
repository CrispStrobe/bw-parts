<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 40" width="56" height="40">
  <!-- OLED Display 128x64 — I2C breakout, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="52" height="30" rx="2" fill="#0066aa" stroke="#004080" stroke-width="0.8"/>
  <!-- OLED glass -->
  <rect x="6" y="4" width="44" height="22" rx="1" fill="#000" stroke="#222" stroke-width="0.5"/>
  <!-- Simulated OLED content (bright blue text) -->
  <text x="28" y="14" text-anchor="middle" font-family="monospace" font-size="4" fill="#00ccff">Hello</text>
  <text x="28" y="22" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#00ccff">World!</text>
  <!-- Pin header (4 pins, I2C) -->
  <line x1="14" y1="32" x2="14" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="22" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="32" x2="30" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="38" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="14" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="22" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="30" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="38" cy="40" r="1.5" fill="#c0c0c0"/>
  <!-- Labels -->
  <text x="14" y="30" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">VCC</text>
  <text x="22" y="30" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">GND</text>
  <text x="30" y="30" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">SCL</text>
  <text x="38" y="30" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">SDA</text>
</svg>
