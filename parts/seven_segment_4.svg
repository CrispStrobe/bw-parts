<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 48" width="100" height="48">
  <!-- 4-Digit 7-Segment Display — bench-style front view -->
  <!-- Housing -->
  <rect x="2" y="2" width="96" height="36" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- Display windows (4 digits) -->
  <g fill="#200808">
    <rect x="6" y="5" width="20" height="30" rx="1"/>
    <rect x="28" y="5" width="20" height="30" rx="1"/>
    <rect x="52" y="5" width="20" height="30" rx="1"/>
    <rect x="74" y="5" width="20" height="30" rx="1"/>
  </g>
  <!-- Digit 1: "1" -->
  <g fill="#ff2020" opacity="0.3">
    <rect x="10" y="8" width="12" height="2.5" rx="0.5"/>
    <rect x="21" y="10" width="2.5" height="10" rx="0.5"/>
    <rect x="21" y="22" width="2.5" height="10" rx="0.5"/>
    <rect x="10" y="31" width="12" height="2.5" rx="0.5"/>
    <rect x="8.5" y="22" width="2.5" height="10" rx="0.5"/>
    <rect x="8.5" y="10" width="2.5" height="10" rx="0.5"/>
    <rect x="10" y="19.5" width="12" height="2.5" rx="0.5"/>
  </g>
  <g fill="#ff2020" opacity="0.85">
    <rect x="43" y="10" width="2.5" height="10" rx="0.5"/>
    <rect x="43" y="22" width="2.5" height="10" rx="0.5"/>
  </g>
  <!-- Colon between digits 2-3 -->
  <circle cx="50" cy="16" r="1.5" fill="#ff2020" opacity="0.6"/>
  <circle cx="50" cy="26" r="1.5" fill="#ff2020" opacity="0.6"/>
  <!-- Digits 3-4 (dimmed, showing segments) -->
  <g fill="#ff2020" opacity="0.3">
    <rect x="56" y="8" width="12" height="2.5" rx="0.5"/>
    <rect x="67" y="10" width="2.5" height="10" rx="0.5"/>
    <rect x="56" y="19.5" width="12" height="2.5" rx="0.5"/>
    <rect x="54.5" y="22" width="2.5" height="10" rx="0.5"/>
    <rect x="56" y="31" width="12" height="2.5" rx="0.5"/>
  </g>
  <g fill="#ff2020" opacity="0.3">
    <rect x="78" y="8" width="12" height="2.5" rx="0.5"/>
    <rect x="89" y="10" width="2.5" height="10" rx="0.5"/>
    <rect x="89" y="22" width="2.5" height="10" rx="0.5"/>
    <rect x="78" y="31" width="12" height="2.5" rx="0.5"/>
    <rect x="76.5" y="22" width="2.5" height="10" rx="0.5"/>
    <rect x="78" y="19.5" width="12" height="2.5" rx="0.5"/>
  </g>
  <!-- Pins at bottom (simplified — 12 pin DIP) -->
  <g>
    <line x1="20" y1="38" x2="20" y2="48" stroke="#aaa" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="40" y1="38" x2="40" y2="48" stroke="#aaa" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="60" y1="38" x2="60" y2="48" stroke="#aaa" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="80" y1="38" x2="80" y2="48" stroke="#aaa" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
