<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 56" width="16" height="56">
  <!-- Water Level Sensor — thin PCB strip, bench-style -->
  <!-- PCB strip -->
  <rect x="2" y="0" width="12" height="44" rx="1" fill="#0a5a0a" stroke="#084a08" stroke-width="0.5"/>
  <!-- Exposed traces (sensing electrodes) -->
  <g fill="#c0a040">
    <rect x="4" y="4" width="8" height="2" rx="0.3"/>
    <rect x="4" y="10" width="8" height="2" rx="0.3"/>
    <rect x="4" y="16" width="8" height="2" rx="0.3"/>
    <rect x="4" y="22" width="8" height="2" rx="0.3"/>
    <rect x="4" y="28" width="8" height="2" rx="0.3"/>
    <rect x="4" y="34" width="8" height="2" rx="0.3"/>
  </g>
  <!-- Connector at bottom -->
  <rect x="1" y="44" width="14" height="6" rx="1" fill="#333" stroke="#444" stroke-width="0.3"/>
  <!-- Pins -->
  <line x1="4" y1="50" x2="4" y2="56" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="8" y1="50" x2="8" y2="56" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="12" y2="56" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="4" cy="56" r="1.5" fill="#c0c0c0"/>
  <circle cx="8" cy="56" r="1.5" fill="#c0c0c0"/>
  <circle cx="12" cy="56" r="1.5" fill="#c0c0c0"/>
</svg>
